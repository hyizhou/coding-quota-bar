name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx electron-vite build

      - name: Pre-create draft release
        # electron-builder 26 并发上传产物时可能为同一 tag 各自创建草稿 Release；
        # 提前建好草稿，发布器会统一复用，避免出现重复 Release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "${GITHUB_REF_NAME#v}" || echo "release already exists, reusing"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package & Publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Store bundle (appx)
        run: npx electron-builder --win appx --publish never

      - name: Upload appx artifact
        uses: actions/upload-artifact@v7
        with:
          name: cqb-appx
          path: release/*.appx
          retention-days: 3
