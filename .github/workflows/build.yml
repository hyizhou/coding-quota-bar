name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx electron-vite build

      - name: Package & Publish
        run: npx electron-builder --win --publish always "-c.publish.provider=github" "-c.publish.owner=$env:REPO_OWNER" "-c.publish.repo=$env:REPO_NAME" "-c.publish.releaseType=release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
